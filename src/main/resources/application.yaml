spring:
  application:
    name: nafas
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/nafas
    username: nafas
    password: nafas
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

nafas:
  openaq:
    base-url: https://api.openaq.org/v3
    api-key: ${OPENAQ_API_KEY:}
    location-id: 2178   # a placeholder OpenAQ location id; will be made configurable later
    poll-interval-ms: 300000   # 5 minutes
